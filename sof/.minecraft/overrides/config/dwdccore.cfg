# Configuration file

general {
    # Delay in ticks before breaking the block after crafting/smelting (0 = immediate)
    # Min: 0
    # Max: 100
    I:breakDelay=0

    # List of crafting table block IDs that should be disposable
    S:disposableCraftingTables <
        minecraft:crafting_table
     >

    # List of furnace block IDs that should be disposable
    S:disposableFurnaces <
        minecraft:furnace
        minecraft:lit_furnace
     >

    # Should the block drop items when broken after crafting/smelting
    B:dropItemsOnBreak=false

    # Enable/disable disposable crafting tables
    B:enableDisposableCrafting=true

    # Enable/disable disposable furnaces
    B:enableDisposableFurnace=true
}


